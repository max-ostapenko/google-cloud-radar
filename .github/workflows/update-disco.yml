name: Update Discoveries Directory
on:
  schedule:
    - cron: "0 */5 * * *"
  workflow_dispatch:

concurrency:
  group: update-discoveries
  cancel-in-progress: false

jobs:
  update-discoveries:
    if: ${{ github.repository == 'max-ostapenko/google-cloud-radar' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # push feed commits
      pull-requests: write # create/update PRs via gh
      issues: write # add automerge label
      id-token: write # Workload Identity Federation
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM_EMAIL: ${{ vars.RESEND_FROM_EMAIL || 'Google Cloud Radar <alerts@google-cloud-radar.com>' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          # Need at least 2 commits of history so git diff HEAD~1 works
          fetch-depth: 2

      - name: Authenticate to Google Cloud (ADC)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Restore and cache release notes archive
        uses: actions/cache@v6
        with:
          path: data/release_notes_archive.json
          key: release-notes-archive-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            release-notes-archive-${{ runner.os }}-
            release-notes-archive-

      - name: Update discoveries, extract diffs, correlate releases, sync Firestore DB, dispatch email alerts, and open PR
        run: |
          npm run update:disco && npm run diff:feed && npm run correlate -- --database radar && npm run seed:firestore -- --project gcp-cloud-radar --database radar && npm run alerts:email -- --project gcp-cloud-radar --database radar && npm run pr:open
