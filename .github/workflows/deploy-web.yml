name: Deploy Web to Firebase Hosting

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - 'feed/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    if: ${{ github.repository == 'max-ostapenko/discovery-artifact-manager' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Workload Identity Federation
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (ADC)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build Astro static site
        working-directory: web
        run: npm run build

      - name: Deploy to Firebase Hosting
        working-directory: web
        run: npx -y firebase-tools deploy --only hosting --project max-ostapenko
