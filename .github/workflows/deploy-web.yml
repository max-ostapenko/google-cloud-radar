name: Deploy Web to Firebase Hosting

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "data/**"
  workflow_run:
    workflows: ["Update Discoveries Directory"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    if: >
      github.repository == 'max-ostapenko/google-cloud-radar' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Workload Identity Federation
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud (ADC)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: "npm"
          cache-dependency-path: "web/package-lock.json"

      - name: Install dependencies
        working-directory: web
        run: npm install

      - name: Build Astro static site
        working-directory: web
        run: npm run build

      - name: Deploy to Firebase Hosting and Firestore Rules
        working-directory: web
        run: npx -y firebase-tools deploy --only hosting,firestore:rules --project gcp-cloud-radar
